# Outils de developpement pour 3D Printer Maintenance.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Erreurs de syntaxe et noms indefinis sur tout le paquet ; regles completes
# sur les modules purs et les tests (le code historique n'est pas reformate).
select = ["E9", "F63", "F7", "F82", "F401", "F811"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
